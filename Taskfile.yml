version: '3'

tasks:
  check:
    desc: Single quality gateway — every task must leave this green
    cmds:
      - go vet ./...
      - task: lint
      # internal/gateway, cmd/vtt, and internal/mcp are the socket-heavy
      # suites (real WebSocket/subprocess tests, or in-process MCP sessions
      # fronting a fake WebSocket wire per P7 task-1-brief.md): run
      # everything else in parallel, then run those three serialized (-p 1).
      #
      # CORRECTION (2026-07-29). This comment previously called the repeated
      # TestThreeRoleExitScenarioOverLiveWebSockets failure "a
      # resource-contention flake, not a logic bug", and credited -p 1 as the
      # primary fix. That diagnosis was WRONG, and it cost an hour of chasing
      # load. The real cause: the gateway does not order a command's
      # CommandResult against the Envelopes that command produced (server.go's
      # "Writer choice" comment says so), and the test helpers read
      # POSITIONALLY, discarding skipped frames — so one inversion
      # desynchronised a connection permanently and a later read hung until
      # its deadline. Captured frame logs showed the inversion directly.
      # Fixed properly by demultiplexing results and events per connection
      # (frameQueue, server_test.go); verified with 96 suite runs under 8-way
      # contention, the condition that used to reproduce it within one round.
      #
      # -p 1 is kept for genuine resource reasons (these suites open real
      # sockets and subprocesses), NOT as a flake mitigation.
      # The Go suite runs inside check:coverage, which executes exactly these
      # two package sets with -count=1 (strictly stronger than a cached run)
      # plus a third instrumented pass over cmd/vtt. Running them here too
      # would execute the whole suite twice per `task check` for no added
      # signal — a test failure in any pass still aborts the gate.
      - task: check:coverage
      # Same reasoning as check:coverage above: check:ts-coverage runs exactly
      # `bun test client/test contract contract-spike`, with coverage on, so
      # running the bare suite here as well would execute it twice for no
      # added signal. A test failure there still aborts the gate.
      - task: check:ts-coverage
      - task: client:typecheck
      - task: check:drift
      - task: check:breaking
      - task: check:invariants
      - task: check:doc-owner
      - task: check:no-retraction
      - task: check:arch
      # BEFORE the mutation gates: ~53s against their minutes, so a race
      # failing here saves the long wait. NOT claimed to be first-cheapest
      # overall — check:coverage above runs the whole Go suite before this.
      - task: check:race
      - task: check:mutation
      # Now covers EVERY file under client/src/ except the browser entry
      # point -- the backlog that made this "scoped to two files" is closed,
      # and tools/ts-mutation-scope.md records how it was worked down and what
      # it cost. Same shape as check:mutation, whose tools/mutation-scope.md
      # documents why internal/harness is out.
      #
      # RUNS ON LINUX, WHICH ON THIS MAC MEANS A CONTAINER THE TASK STARTS
      # ITSELF. macOS 26's socket-accounting kernel bug (FB21686886) makes a
      # native run arithmetically impossible. Until 2026-08-29 this comment
      # said the task "skips loudly there and CI is authoritative", and BOTH
      # halves were false: 334eae7 made it invoke the container, and ci.yml
      # has been workflow_dispatch-only since 2026-08-10. Full detail in its
      # desc.
      #
      # 334eae7 also made this the SECOND mutation gate in a row on one
      # machine -- the list order above is older, but before that commit this
      # task skipped on macOS, so the pair had never actually run back to
      # back. It is not free: over byte-identical inputs the TS timeout count
      # has read 31, 94, 322 and 31 again; the 94 and the 322 are the loaded
      # runs and 31 is the floor. tools/mutation-scope.md has the table; read
      # it before concluding anything from one run's timeout figure.
      - task: check:ts-mutation

  # --- test tiers -----------------------------------------------------------
  #
  # Tiered by what a test IS, not by what it costs. Patrik's model, and the
  # ordering rule that goes with it: a slow unit test is still a unit test and
  # stays in tier 1. Timing is not a category.
  #
  #   1 unit/area  - one component, fakes at its edges. The TDD loop: written
  #                  red against the spec, run on every change.
  #   2 cross-layer - several layers wired together in-process. Run when a
  #                  layer boundary changes.
  #   3 external   - real processes and transports. Run when those change.
  #   4 whole product - `task check` (defined above). Pre-merge / CI only.
  #
  # Packages land in a tier by their nature:
  #   internal/harness is TIER 1: its tests drive the harness library against
  #     scripted fakes, which is a unit test of that library. It used to be the
  #     slowest package by far (~51s of tier 1's 55s), purely from fixed
  #     sleeps; the tests now run inside testing/synctest bubbles and the
  #     package takes ~0.7s. Tier 1 as a whole is ~6s.
  #   internal/gateway and internal/mcp are TIER 2: real in-process wiring
  #     across gateway/campaign/store and mcp/harness respectively.
  #   cmd/vtt is TIER 3 whole and undivided. It is the composition root; its
  #     tests exercise the assembled binary, subprocesses, signals and real
  #     stdio. Splitting it by file would need a build tag, which would take
  #     those files out of lint and coverage -- silently narrowing two gates to
  #     speed up a third is the trade this repo keeps getting burned by.

  test:unit:
    desc: Tier 1 -- unit/area tests. The TDD loop; run on every change.
    cmds:
      # -E with a (/|$) boundary, NOT a substring match: plain
      # `grep -v /internal/gateway` also swallows a future internal/gatewayx,
      # and the tier 2/3 patterns would not pick it up (go's `x/...` matches
      # only x and x/-prefixed), so it would land in NO tier while every tier
      # still reported green. check:coverage's identical filter is backstopped
      # by list-measured-packages.sh; these tasks have no such backstop.
      - go test -count=1 $(go list ./... | grep -v -E '/(internal/(gateway|mcp)|cmd/vtt)(/|$)')
      # The TypeScript contract round-trips are unit tests by this tier's own
      # definition. They select through bun, not `go list`, so they have to be
      # named explicitly or an edit to a contract event gets a green tier 1
      # with them never run.
      #
      # Directories are listed EXPLICITLY rather than letting bun glob: its
      # default matcher also picks up *.spec.ts, which would drag the
      # Playwright e2e into the unit tier where there is no browser to run
      # them. e2e is `task e2e`, deliberately outside `check` (spec §6).
      - bun test client/test contract contract-spike

  test:cross:
    desc: Tier 2 -- cross-layer tests. Run when a layer boundary changes.
    cmds:
      # -p 1: these open real sockets in-process; see check's note.
      - go test -count=1 -p 1 ./internal/gateway/... ./internal/mcp/...

  test:external:
    desc: Tier 3 -- external interactions (subprocesses, signals, real stdio).
    cmds:
      # -p 1 mirrors check's own cmd/vtt run. A no-op while cmd/vtt is a
      # single package, but the moment it gains a subpackage this would start
      # running subprocess suites concurrently while check still serialises
      # them -- a divergence that shows up only as a local flake.
      - go test -count=1 -p 1 ./cmd/vtt/...

  e2e:
    desc: >
      Browser end-to-end against the SHIPPED binary, with screenshots.
      DELIBERATELY NOT part of `task check` (client spec §6): it needs a
      browser binary, which would make the default loop undownloadable on a
      fresh clone. Mandatory at review and for the demo instead.
      First run needs `bunx playwright install chromium`.
      Screenshots land in client/e2e/.artifacts — they are the remote demo
      medium, not decoration.
    cmds:
      - bunx playwright test

  build:client:
    desc: >
      Build the web client into cmd/vtt/webdist, which is COMMITTED and
      embedded into the binary. The output must be byte-identical across
      runs or check:drift becomes a random failure — see client/vite.config.ts
      for the settings that guarantee that (no content hashes, no sourcemaps)
      and why each one is there.
    cmds:
      - bunx vite build --config client/vite.config.ts

  client:typecheck:
    desc: >
      Strict TypeScript typecheck of the client. Beyond `strict` this turns on
      noUncheckedIndexedAccess and exactOptionalPropertyTypes, because the
      fold mirrors a Go implementation field for field and the failure that
      matters is a silently-undefined lookup producing a state that differs
      from the server's without anything throwing. bun RUNS TypeScript but
      does not type-check it, so without this the types are decoration.
    cmds:
      - bunx tsc --noEmit -p client/tsconfig.json

  check:secrets:staged:
    desc: >
      Scan STAGED changes for secrets (pre-commit). The repo is private and
      .gitignore already excludes tokens.json/*.tokens.json, but "private"
      and "gitignored" are both one mistake away from a leaked bearer token
      in history, where deleting it does not undo it.
    cmds:
      - gitleaks git --staged --no-banner --redact -l error .

  check:secrets:
    desc: Scan the whole history for secrets (CI).
    cmds:
      - gitleaks git --no-banner --redact -l error .

  setup:
    desc: >
      One-time setup for a fresh clone: JS dependencies and git hooks.
      Both are invisible when missing, which is the problem. `bun test` runs
      inside `task check` and needs node_modules (gitignored, so a clone has
      none) -- CI's very first run failed on exactly this, after the gate had
      been green locally for weeks against a directory that happened to
      already exist. Hooks are worse: an unhooked clone looks identical from
      the inside and simply never enforces anything.
    cmds:
      - bun install --frozen-lockfile
      - lefthook install

  check:fast:
    desc: >
      Tier 1 only, plus vet and lint -- the pre-commit / inner-loop gate.
      NOT a substitute for `task check`, which is the merge gate. WHAT THIS
      SKIPS is every step of `check:` above except the two it repeats (go vet
      and lint), plus tiers 2-4 of the suite. Enumerated 2026-09-01, so nobody
      has to diff the two by hand: test:cross, test:external, check:coverage,
      check:ts-coverage, client:typecheck, check:drift, check:breaking,
      check:invariants, check:doc-owner, check:no-retraction, check:arch,
      check:race, check:mutation and check:ts-mutation. The list read
      "test:cross, test:external, check:coverage, check:mutation, check:drift,
      check:breaking, check:arch and check:invariants" until 2026-09-01 and
      omitted six, check:no-retraction among them -- which `ac307d5` had added
      to `check:` in the same commit. The invariant is the first sentence; the
      names are the convenience, and they are what rots.
    cmds:
      - go vet ./...
      - task: lint
      - task: test:unit

  lint:
    desc: >
      golangci-lint over the whole tree, tests included. Config lives in
      .golangci.yml -- read its header before editing, because `run` accepts
      an INVALID config silently and reports 0 issues.
    cmds:
      # `config verify` first: the config is schema-checked before it is
      # trusted. Without this, a v1-schema key or a mistyped `version` is
      # ignored without a warning and the gate passes while enforcing far
      # less than it claims -- which is exactly how this config shipped its
      # first draft (a dead linters-settings block, and an exclusion whose
      # text matched every `unused` message and so disabled that linter
      # outright).
      #
      # THE FETCH IS RETRIED because `config verify` loads its JSON schema
      # OVER THE NETWORK, from a URL pinned to the binary's own major.minor
      # (golangci.v2.11.jsonschema.json for 2.11.x). A CDN blip therefore reds
      # the whole gate with `compile schema: failing loading ... context
      # deadline exceeded`, which looks nothing like a lint problem. Observed
      # 2026-08-04 in CI run 30912947244: the fetch timed out in ~2s, and that
      # 2s took a 2m02s run with it. A 2s failure is exactly what makes a
      # retry cheap.
      #
      # THERE IS A HIDDEN `--schema` FLAG that accepts a local file, and it
      # does work offline (verified against 2.11.4 with the network blocked:
      # a valid config passes, `bogus-v1-key` and a numeric `version` both
      # still fail). It is deliberately NOT used here, for two reasons that
      # outrank the flake:
      #   1. A vendored schema DRIFTS. Bump to 2.12 without re-vendoring and
      #      .golangci.yml is validated against 2.11's schema -- silent
      #      under-enforcement, which is the precise failure this step exists
      #      to prevent (see .golangci.yml's header, point 1). Catching that
      #      drift needs a version check nobody would write. The live fetch is
      #      definitionally in sync with the binary.
      #   2. `MarkHidden` is unsupported surface: a minor bump can drop it
      #      with no changelog line, reddening the gate more confusingly than
      #      the flake being fixed.
      # NOT rejected as "hand-rolled enforcement code" -- with --schema you
      # would vendor DATA and golangci-lint would still be the validator, so
      # check-mutation.py's precedent about hand-rolled gates does not reach
      # this alternative. The reason is drift, not authorship.
      #
      # Making the failure non-fatal was also rejected: an unverified config
      # is the state this step prevents, so warning instead of failing would
      # be weakening a gate to pass it (CLAUDE.md rule 2).
      #
      # A config verdict must not be retried; a failed FETCH must not be
      # reported as a config verdict. "failing loading" is the discriminator
      # (santhosh-tekuri/jsonschema's LoadURLError); it covers 404, TLS and
      # proxy-error-page failures too. No pipes below, for the reason
      # check:coverage and check:mutation both document: `cmd | tee` takes the
      # PIPELINE's status, so `set -e` never fires and a failing gate ships
      # green.
      - |
        set -e
        LOG="$(mktemp -t lint-verify.XXXXXX)"
        trap 'rm -f "$LOG"' EXIT
        attempt=1
        while :; do
          if golangci-lint config verify > "$LOG" 2>&1; then
            break
          fi
          if ! grep -q "failing loading" "$LOG"; then
            cat "$LOG" >&2
            [ -s "$LOG" ] || echo "lint: config verify failed but printed nothing" >&2
            exit 1
          fi
          if [ "$attempt" -ge 3 ]; then
            cat "$LOG" >&2
            echo "lint: config verify could not FETCH its schema after 3 attempts." >&2
            echo "lint: this is the network, not .golangci.yml -- the config was never checked." >&2
            exit 1
          fi
          echo "lint: schema fetch failed (attempt $attempt/3), retrying..." >&2
          attempt=$((attempt + 1))
          sleep 3
        done
      - golangci-lint run ./...

  check:ts-mutation:
    desc: >
      Mutation testing over the TypeScript client. Gates on ZERO
      UNADJUDICATED SURVIVORS (tools/ts-mutation-equivalents.txt), not on a
      mutation-score percentage -- a score is a ratio, and enough newly-killed
      mutants mask a new survivor.

      This exists because check:ts-coverage cannot see the gap it finds.
      undo.ts was at 100% line coverage and 78.75% mutation score, and the
      survivors sat on the `>= from` / `<= to` comparisons -- the inclusive
      [from,to] range that IS retraction. Every line ran; nothing checked the
      boundary.

      Stryker has no bun test-runner plugin, so it drives `bun test` as an
      opaque command and reads the exit code; coverageAnalysis is off because
      the command runner cannot do per-test filtering. Config is
      stryker.conf.json -- note ignorePatterns, which excludes a symlinked
      adventures directory that Stryker's sandbox copy cannot follow.

      IN `task check`, AND NOT SCOPED. `mutate` is the glob
      `client/src/**/*` less the browser entry point: every file in the client,
      including any added tomorrow. It was held out while the worked-down set
      was one file; it is in because a gate nobody runs protects nothing.

      CORRECTED 2026-08-25. This said `mutate` covered "undo.ts and fold.ts",
      and that ts-mutation-scope.md carried "the twelve remaining files" -- both
      true before 2026-08-03 and false since, when the list became the glob. It
      also said "adding a file to `mutate` is the last step of working it down,
      never the first", which the glob makes impossible: a new file is gated the
      moment it is created, so that is always the FIRST step now.

      That is the right trade and it is kept deliberately -- no file should be
      able to escape the gate by being new -- but it has a cost worth naming,
      because it was paid: scene-plan.ts and canvas.ts were created by the maps
      and visibility arcs, gated instantly by the glob, and never worked down.
      They carried 65 survivors between them, unseen, because this gate was
      broken from 2026-08-11 to 2026-08-25. A new client file is gated from
      birth; work it to zero in the commit that adds it, or the debt is invisible
      until something makes the gate speak again.

      Runtime grows with the gated set: ~1m12s for two files, and the full
      client measured 4m55s over 1667 mutants. If that becomes the wrong trade
      for the merge gate, move it to a pre-merge-only task -- do not narrow
      `mutate` to make it fast, which would weaken the gate to pass it.

      LINUX-ONLY SINCE 2026-08-03 (Patrik's call), and the reason is a KERNEL
      BUG, not a trade. macOS 26.x leaks socket memory accounting on every
      close(): soclose_locked() -> sofree() -> sofreelastref(so, 0) passes
      dealloc=0, skipping the sodealloc() that decrements the counters. Apple
      DTS has REPRODUCED it -- Feedback FB21686886, discussion at
      developer.apple.com/forums/thread/813116 -- with no fix in any release
      or beta as of May 2026 and no workaround. OpenJDK disabled networking
      tests over it. macOS 15.7.x and earlier are unaffected.

      socket() starts returning ENOBUFS at ~161,000 creations per boot. This
      gate costs 175 sockets per `bun test client/test` run (measured five
      ways -- peak-sampled x3 and post-exit x2, all exactly 175) times 1667
      mutants = ~292,000. That is 1.8x the entire machine budget, so on macOS
      it CANNOT COMPLETE even from a cold boot, and the attempt takes DNS,
      curl and every socket-opening Go test down with it for the rest of the
      session -- looking exactly like a product bug. That is what happened on
      2026-08-03, and it dates precisely to `mutate` expanding from two files
      to the whole client.

      THIS IS NOT THE GATE NARROWED TO PASS. `mutate` is untouched and no
      threshold moved; only the KERNEL it runs on changes.

      Run it with `task check:ts-mutation:docker`, which executes this exact
      gate inside a Linux container on the same machine — same config, same
      mutate list, same adjudication file, same checker. Measured 2026-08-07:
      1772 mutants, 1692 killed, 19 timed out, 61 adjudicated, zero
      unadjudicated survivors. So the local signal is NOT lost on a Mac; it
      just is not this task that provides it.

      CI RUNS THIS GATE ONLY WHEN SOMEBODY ASKS IT TO. `.github/workflows/
      ci.yml` is `on: workflow_dispatch:` and nothing else -- no push trigger,
      no pull_request trigger. THE CONTAINER IS THE ONLY THING THAT RUNS THIS
      GATE UNASKED, so `task check:ts-mutation:docker` is not a convenience,
      it is the gate.

      CORRECTED 2026-08-25, and this sentence is why the correction matters.
      It read "CI still runs it on every push to main", which was false, and it
      was the belief that let this gate die: it tested ZERO mutants from
      2026-08-11 to 2026-08-25 while everyone had a documented reason to think
      something else was covering it. Fourteen days, 125 accumulated survivors,
      and a green `task check` on a Mac the whole time. If you find yourself
      trusting a downstream runner named in a comment, CHECK ITS TRIGGER.

      A green `task check` on a Mac has still not proven THIS gate. That is
      what the skip banner says, and it stays loud.

      DO NOT "fix" this by sharing Bun.serve per test file. Measured: only
      ~27 of the 175 are listeners (the shareable part); the rest are
      connections each test genuinely makes. Ceiling is ~15%, and 1667 x 148
      is still far over budget. At 175/run everyday `bun test` gets ~920 runs
      per boot and was never the problem -- only the 1667x multiplier is.

      pcbcount IS NOT THE SIGNAL. It always drains (20,000 bare sockets take
      it 25 -> 20,025 and back to 25 within 15s). The leaking counter is not
      exported by any sysctl, so the machine reads healthy right up to the
      wall. Do not check pcbcount to decide whether it is safe to run.
    cmds:
      # ABOVE the platform guard deliberately: this is the gate-checker's own
      # 44 unit tests, it opens no sockets, it runs in well under a second, and
      # it runs nowhere else in the repo. FB21686886 is no reason to stop
      # proving the enforcement code -- check-ts-mutation.py's own header
      # records that 8 of 9 defects across five review rounds were in
      # hand-rolled enforcement rather than in the thing being enforced.
      - python3 tools/check_ts_mutation_test.py -q
      # The split's own decision logic: hashing too little reports a stale
      # report as current, which is the gate silently ceasing to cover the
      # client while still printing a verdict.
      - python3 tools/ts_mutation_inputs_test.py -q
      - |
        set -e
        # PLATFORM GUARD -- full rationale in this task's desc. Short version:
        # macOS 26 kernel bug FB21686886 makes this gate arithmetically
        # impossible locally (~292,000 sockets needed, ~161,000 available).
        #
        # Version-gated, NOT a blanket Darwin skip: macOS 15.7.x and earlier
        # do not have the bug, and skipping there would take a working gate
        # away for no reason. Darwin major 25 IS macOS 26 (25.2.0 = 26.2), so
        # the test is >= 25. When Apple ships a fix, raise the ceiling here
        # rather than deleting the guard -- the affected range is closed at
        # the bottom and still open at the top.
        # SPLIT INTO A CHEAP HALF AND AN EXPENSIVE ONE (2026-08-28, Patrik's
        # call). PRODUCING the report costs 62 minutes in the container;
        # CHECKING it costs 2.7 seconds against the stored report. Only the
        # second is needed when the checker or the adjudication file changes.
        # On 2026-08-27 six commits were pushed, NONE of which touched anything
        # Stryker mutates, and the 62 minutes were spent anyway.
        #
        # So the verify runs every time and the mutate runs only when the
        # report's inputs hash differently than when it was made. That is what
        # makes it affordable to invoke the CONTAINER from here rather than
        # printing a banner and hoping somebody types it -- the honour-system
        # arrangement that let this gate test zero mutants for fourteen days.
        REPORT=reports/mutation/mutation.json
        STAMP=reports/mutation/ts-inputs.sha256
        WANT="$(python3 tools/ts-mutation-inputs.py || true)"
        HAVE=""
        [ -f "$STAMP" ] && HAVE="$(cat "$STAMP")"
        # FAIL TOWARDS PRODUCING. No report, no stamp, an unhashable tree, or
        # any mismatch all mean re-measure. Only an exact match on a report
        # that exists may skip the expensive half.
        NEED_REPORT=1
        if [ -f "$REPORT" ] && [ -n "$WANT" ] && [ "$WANT" = "$HAVE" ]; then NEED_REPORT=0; fi

        DARWIN_MAJOR=0
        if [ "$(uname -s)" = "Darwin" ]; then DARWIN_MAJOR="$(uname -r | cut -d. -f1)"; fi

        if [ "$NEED_REPORT" = "0" ]; then
          echo "check:ts-mutation: client sources, tests, config and lockfile are"
          echo "  unchanged since the stored report was produced. Verifying that"
          echo "  report; not re-mutating. (Force: rm $STAMP)"
        elif [ "$DARWIN_MAJOR" -ge 25 ] && [ "${VTT_FORCE_TS_MUTATION:-0}" != "1" ]; then
          echo "==============================================================" >&2
          echo "  check:ts-mutation cannot run NATIVELY on macOS 26" >&2
          echo "  (kernel bug FB21686886), so it is running in the Linux" >&2
          echo "  container instead. THIS IS NOT A SKIP." >&2
          echo "" >&2
          echo "  Needs ~292,000 socket creations; macOS 26 allows ~161,000" >&2
          echo "  per boot before socket() returns ENOBUFS. Same config, same" >&2
          echo "  mutate list, same checker -- only the kernel changes." >&2
          echo "" >&2
          echo "  IT COSTS ABOUT AN HOUR and needs Docker Desktop running." >&2
          echo "  You are seeing this because the client sources, tests," >&2
          echo "  config or lockfile changed since the stored report was" >&2
          echo "  made; nothing else triggers it." >&2
          echo "" >&2
          echo "  NOTHING ELSE WILL PROVE IT FOR YOU. CI is" >&2
          echo "  workflow_dispatch-only -- it runs when somebody asks, not" >&2
          echo "  on push. This banner used to say CI was AUTHORITATIVE, and" >&2
          echo "  that is how the gate tested zero mutants for 14 days in" >&2
          echo "  August 2026 while everyone read this and moved on. It then" >&2
          echo "  said to run the container YOURSELF, which was the same" >&2
          echo "  honour system wearing a different hat; now the gate runs it." >&2
          echo "" >&2
          echo "  Native override (fresh boot only): VTT_FORCE_TS_MUTATION=1" >&2
          echo "==============================================================" >&2
          task check:ts-mutation:docker
          # $WANT, not a fresh hash: it describes the tree the report was made
          # from. Re-hashing after an hour-long run would certify a report that
          # predates any edit made while it ran.
          [ -n "$WANT" ] || { echo "check:ts-mutation: inputs unhashable; refusing to stamp" >&2; exit 1; }
          printf '%s\n' "$WANT" > "$STAMP"
        else
          # NO PIPES here, for the reason check:coverage and check:mutation both
          # document: `cmd | tail` takes the pipeline's status without pipefail,
          # so under `set -e` a failing gate ships green. A guard that swallows
          # a real failure is worse than no guard at all.
          npx stryker run stryker.conf.json
          [ -n "$WANT" ] || { echo "check:ts-mutation: inputs unhashable; refusing to stamp" >&2; exit 1; }
          printf '%s\n' "$WANT" > "$STAMP"
        fi
        # ALWAYS, on every path: the verdict is recomputed from the report
        # against the CURRENT adjudication file, so an entry edited since the
        # report was produced is still judged.
        python3 tools/check-ts-mutation.py tools/ts-mutation-equivalents.txt

  check:ts-mutation:docker:
    desc: >
      check:ts-mutation, run on LINUX inside a container, from a Mac.

      This exists because the gate above cannot run on macOS 26.x — FB21686886
      leaks socket accounting per close(), so the ~292,000 sockets a full run
      costs exceed the machine's ~161,000-per-boot budget and take DNS, curl
      and every socket-opening test down with it. CI on ubuntu-latest was the
      only place the gate spoke.

      A container closes that hole: Docker Desktop on macOS runs a Linux VM, so
      sockets created in here are LINUX sockets and the kernel bug simply does
      not apply. Verified by running the gate and watching it complete rather
      than by reasoning about it.

      The gate is NOT narrowed to fit: same stryker.conf.json, same `mutate`
      list, same adjudication file, same checker. Only the kernel underneath
      changes. That is what makes this a substitute for CI rather than a
      weaker stand-in.

      BOTH Node and Bun are installed, and that is not redundancy. Stryker
      itself runs under NODE — `bunx stryker` fails with "generator is not a
      function", because Stryker is not Bun-compatible as a RUNTIME. Bun is
      still required because stryker.conf.json's command runner shells out to
      `bun test`. So Node runs the mutator and Bun runs the tests, exactly as
      the native task does with `npx`.

      The Go toolchain is NOT needed, because this runs ONE gate.
      Every other gate in `task check` already runs natively on macOS; this is
      the single exception, which is exactly why it is worth containerising.

      node_modules is installed INSIDE the container, into an anonymous volume
      over the mounted one. Bun's macOS binaries would otherwise be visible to
      a Linux process and fail to load.

      Requires the Docker daemon (start Docker Desktop). Costs no GitHub
      Actions minutes, which is the point while the allowance is exhausted.
    cmds:
      - |
        set -e
        if ! docker info >/dev/null 2>&1; then
          echo "check:ts-mutation:docker: the Docker daemon is not running — start Docker Desktop" >&2
          exit 1
        fi
        # NO PIPES, same reason the native task documents: a pipeline hides the
        # exit status and a failing gate would ship green.
        docker run --rm \
          -v "$PWD":/repo \
          -v /repo/node_modules \
          -w /repo \
          --entrypoint bash \
          oven/bun:1.3.10-debian \
          -c 'set -e
              apt-get update -qq && apt-get install -y -qq python3 nodejs npm procps >/dev/null
              bun install --frozen-lockfile
              # Stryker sandboxes carry a SYMLINKED node_modules, and a crashed
              # run leaves them behind in the repo. check_mutation_test.py
              # then fails the whole gate on "a symlink gremlins drops must be
              # recorded with its consequence" — correctly, since an
              # unrecorded symlink in the tree is exactly what that guard
              # exists to catch. Clean up on the way out, whatever happened.
              trap "rm -rf /repo/.stryker-tmp" EXIT
              npx stryker run stryker.conf.json
              python3 tools/check-ts-mutation.py tools/ts-mutation-equivalents.txt'

  check:ts-coverage:
    desc: >
      Per-FILE coverage floors for the TypeScript client, enforced. Same
      ratchet as check:coverage (tools/ts-coverage-thresholds.txt): each file
      is held to what it already earned, so 85% is the entry requirement for
      a new file rather than the target everything sinks to.

      The reason this is a separate gate and not a `coverageThreshold` line in
      bunfig.toml: bun reports coverage ONLY for files a test imported, so an
      unimported file is ABSENT from the report rather than counted as 0, and
      leaves the denominator with it. When this gate was written that hid
      app.ts, view/dm.ts and view/spectator.ts -- 660 lines, 30% of the
      client -- behind a healthy-looking 89.78%. A single global threshold
      would have been green over all of it. So the file list comes from the
      SOURCE TREE and an unmeasured file is an error.

      The checker's own boundary tests run first: it IS the gate, so a bug in
      it makes every number below it a lie. They found one (a file both
      EXCLUDED and given a floor passed silently), and the gate's first real
      run found another (a floor rounded to 2dp landing above the measurement
      it came from).
    cmds:
      # -q: the Go equivalent runs through run_quiet for the same reason —
      # gate output stays legible, and a failure is what should be loud.
      - python3 tools/check_ts_coverage_test.py -q
      - python3 tools/check-ts-coverage.py tools/ts-coverage-thresholds.txt

  check:coverage:
    desc: >
      Per-package coverage floors, enforced. Thresholds RATCHET (see
      tools/coverage-thresholds.txt): each package is held to max(85,
      whatever it already earned), so a package cannot rot down to the
      floor while staying green -- 85% is the entry requirement, not the
      target.

      Subprocess coverage is merged in. cmd/vtt's entrypoints (newServeCmd
      and newMCPCmd RunE bodies, main) are exercised ONLY by tests that
      build the real binary and exec it; `go test` cannot see inside
      another process, so those runs write covdata to their own directory
      (see buildVTTBinary) and `go tool covdata merge` unions it with the
      in-process covdata natively. Without the merge cmd/vtt reads ~79%
      while genuinely covered -- a measurement gap, not a testing gap, and
      the fix is an honest number rather than a lower bar.
    cmds:
      - |
        set -e
        D_UNIT="$(mktemp -d)"
        D_SUB="$(mktemp -d)"
        D_MERGED="$(mktemp -d)"
        PROFILE="$(mktemp -t merged-cov.XXXXXX)"
        EXPECT="$(mktemp -t cov-expect.XXXXXX)"
        LOG="$(mktemp -t cov-tests.XXXXXX)"
        trap 'rm -rf "$D_UNIT" "$D_SUB" "$D_MERGED" "$PROFILE" "$EXPECT" "$LOG"' EXIT

        # Run a command, showing output only if it fails. NOTE the deliberate
        # absence of a pipe: `cmd | tail -3` takes the PIPELINE's exit status
        # (tail's, always 0) without `pipefail`, so `set -e` never fires and a
        # failing step ships green. A review proved that exact defect here, in
        # the line written to prevent it.
        run_quiet() {
          if ! "$@" > "$LOG" 2>&1; then
            cat "$LOG" >&2
            return 1
          fi
        }

        # The gate script is itself gated: several of its own review findings
        # were "passes when it should fail", the one property a gate must not
        # have.
        run_quiet python3 tools/check_coverage_test.py

        # Every package that MUST appear in the profile. This is NOT redundant
        # with coverage-thresholds.txt: `go test -cover -args
        # -test.gocoverdir` emits covdata only from test binaries that RUN, so
        # a package with no _test.go files produces NOTHING and lands in
        # neither the measured set nor the thresholds -- invisible to both
        # set-equality directions. See the script for the full reasoning.
        run_quiet_capture() {
          if ! "$@" > "$EXPECT" 2> "$LOG"; then
            cat "$LOG" >&2
            return 1
          fi
        }
        run_quiet_capture ./tools/list-measured-packages.sh

        # Passes 1-2: in-process coverage, written as covdata rather than a
        # text profile so `go tool covdata merge` can do the merging. These
        # build UNINSTRUMENTED binaries: buildVTTBinary keys off
        # VTT_SUBPROCESS_COVERDIR, not GOCOVERDIR, because `go test -cover`
        # manages GOCOVERDIR itself -- keying off it would instrument the
        # binary in every pass, and `task check` would never once exercise the
        # configuration that actually ships.
        #
        # Output is logged and shown on failure: `go test` writes failure
        # diagnostics to stdout, and >/dev/null would turn a real failure (or
        # the ledgered contention flake) into a bare non-zero exit with
        # nothing to read.
        # Same anchored filter as test:unit -- these two must select the same
        # set, and substring matching would let them drift silently the day a
        # sibling-prefixed package appears. This one IS backstopped
        # (list-measured-packages.sh + check-coverage.py fatal on any package
        # no pass measured), which is why the bug was latent here and live in
        # the tier tasks.
        run_quiet go test -count=1 -cover $(go list ./... | grep -v -E '/(internal/(gateway|mcp)|cmd/vtt)(/|$)') -args -test.gocoverdir="$D_UNIT"
        run_quiet go test -count=1 -cover -p 1 ./internal/gateway/... ./cmd/vtt/... ./internal/mcp/... -args -test.gocoverdir="$D_UNIT"

        # Pass 3: subprocess coverage. buildVTTBinary sees
        # VTT_SUBPROCESS_COVERDIR and builds `go build -cover`, so every exec'd
        # binary drops covdata into D_SUB as it exits. This is what makes
        # cmd/vtt's newServeCmd/newMCPCmd RunE bodies and main() visible --
        # in-process alone cmd/vtt reads 79.5%, with these runs counted 85.2%.
        # NOTE: `go build -cover` without -coverpkg instruments EVERY
        # main-module package linked into the binary, so this pass also lifts
        # internal packages the binary pulls in (internal/rules by ~0.3pp).
        VTT_SUBPROCESS_COVERDIR="$D_SUB" GOCOVERDIR="$D_SUB" run_quiet go test -count=1 -p 1 ./cmd/vtt/...
        if [ -z "$(ls -A "$D_SUB" 2>/dev/null)" ]; then
          echo "check:coverage: no subprocess coverage collected -- cmd/vtt would be understated" >&2
          exit 1
        fi

        # Native merge. This replaced ~200 lines of hand-rolled Python whose
        # block parser and count-summing union produced three of the four
        # review rounds' enforcement defects.
        run_quiet go tool covdata merge -i="$D_UNIT,$D_SUB" -o="$D_MERGED"
        run_quiet go tool covdata textfmt -i="$D_MERGED" -o="$PROFILE"

        python3 tools/check-coverage.py tools/coverage-thresholds.txt "$PROFILE" "$EXPECT"

  check:race:
    desc: >
      The Go race detector over every package that RUNS GOROUTINES.

      It exists because `task check` had no -race anywhere, and that is not a
      theoretical gap: it passed a working tree containing a genuine data race
      AND a "send on closed channel" panic in internal/gateway (presence
      broadcasting into a channel shutdown had already closed). `go test -race`
      on the same tree reported it immediately, on two pre-existing tests. The
      panic was recovered by net/http's handler, so it only LOGGED — and
      because Go map iteration order is random, it delivered a departure
      broadcast to some connections and never to the rest, leaving a permanent
      ghost at the table. Silently.

      A second race followed within the day: a package-global encode seam that
      presence made reachable from a connection's TEARDOWN, so one test's swap
      raced another test's unwinding connection. Two in one branch is the
      argument.

      EVERY package, by EXCLUSION rather than by a list of the concurrent ones.
      The first draft named six packages explicitly, and review caught that as
      the exact trap this gate exists to close: anything not named is uncovered
      AND silently green — a new package, or a subpackage, since
      ./internal/gateway/ does not match internal/gateway/registry/. An
      honour-system "remember to add it here" is precisely the thing whose
      failure this repo keeps rediscovering. check:coverage (:572) and
      test:unit (:97) both already do it this way round.

      Broader AND cheaper, measured: the six-package version cost 58.5s and
      covered 6 packages; this covers all 24 in 52.7s.

      MEASURED before adoption (2026-08-08, Patrik's call), because the
      objection to -race is always runtime and it deserved a number rather than
      a fear. The FLAG costs about 1.3x (internal/gateway 8.11s -> 9.60s; the
      five others 38.35s -> 49.79s). The GATE costs its whole runtime, ~53s,
      because `check` contains no other bare run of these packages —
      check:coverage supplies the instrumented one and the bare suite was
      deliberately removed (:30-35). So this is ~53 additional seconds against
      a 45-60 minute CI run, not the ~13s the flag's marginal cost suggests.
      The 2-10x figure that kept -race out is not what this repo costs either
      way.

      -p 1 ONLY on the second line, and only because gateway/mcp/cmd/vtt open
      real sockets and subprocesses — the same resource reason check:coverage
      gives, applied to the same three packages it applies it to. The rest run
      in parallel; serializing them would cost wall time for nothing. -p is
      package-level, so in-package t.Parallel() is untouched either way and
      this is not a race-hiding knob.

      BLIND SPOT, recorded rather than fixed: cmd/vtt's e2e builds the binary
      with a plain `go build`, so the SUBPROCESS is uninstrumented. This
      race-checks the test/client side, not the server it drives — that server
      code is covered in-process by internal/gateway. cmd/vtt is the largest
      single cost here for the least race signal.
    cmds:
      - go test -race -count=1 $(go list ./... | grep -v -E '/(internal/(gateway|mcp)|cmd/vtt)(/|$)')
      - go test -race -count=1 -p 1 ./internal/gateway/... ./internal/mcp/... ./cmd/vtt/...

  check:mutation:
    desc: >
      Mutation gate (ADR-010): every surviving mutant must be adjudicated
      equivalent in tools/mutation-equivalents.txt, with a stated reason.
      Runs as part of `check` -- Patrik's ruling, 2026-07-28: "Time is not an
      issue, quality is. Do not count seconds to achieve quality." An earlier
      draft kept this out of check purely on runtime, and that reasoning is
      void.

      Not gremlins' own --threshold-efficacy: that gates on a ratio, so enough
      newly-killed mutants can mask a new survivor (49k/2L = 96.08% passes,
      and so does 100k/3L at 97.1%). The standard is the 2026-07-24 audit's
      own -- zero UNADJUDICATED survivors.

      internal/harness is still excluded, but the OLD REASON is void. It was
      "fixed sleeps cost ~70s PER MUTANT, so a full run is hours". Those
      sleeps are gone -- the tests run in synctest bubbles -- and a full run
      now measures 3m38s (158 killed, 29 lived, 32 not covered, 1 timed out).
      What blocks it is the 29 survivors: they must be killed or adjudicated
      first, or adding the package would simply red the gate. That is a real
      gap in the harness's own tests, no longer a runtime excuse.
    cmds:
      - |
        set -e
        LOG="$(mktemp -t mutation-tests.XXXXXX)"
        trap 'rm -f "$LOG"' EXIT
        # NO PIPE. `cmd | tail -3` takes the PIPELINE's exit status (tail's,
        # always 0) without pipefail, so under `set -e` a failing gate-test
        # ships green -- the exact defect a review found in check:coverage's
        # equivalent line, and one I re-introduced here before catching it.
        if ! python3 tools/check_mutation_test.py > "$LOG" 2>&1; then
          cat "$LOG" >&2
          exit 1
        fi
        tail -3 "$LOG"
        python3 tools/check-mutation.py tools/mutation-equivalents.txt

  check:doc-owner:
    desc: >
      Fail when a doc comment names a DIFFERENT function than the one it sits
      on. Insert a function between a comment and its owner and Go says
      nothing: the comment silently belongs to the newcomer, the original is
      left bare, and the next reader is told about a function they are not
      looking at.

      Found two on its first run, both months old, both in
      internal/harness/soak.go — and I had just done it myself in
      internal/gateway/presence.go, caught by review, which is not a mechanism
      that scales.

      Deliberately NARROW: it fires only when the first word names another
      function that actually exists. Enforcing Go's full "doc starts with the
      name" convention would flag internal/rules' `// Complexity:` blocks,
      which sit above //nolint:gocyclo for a stated reason — and a gate whose
      first act is to demand the removal of correct code is a gate that gets
      switched off.
    cmds:
      - python3 tools/check_doc_owner_test.py -q
      - python3 tools/check-doc-owner.py .

  check:no-retraction:
    desc: >
      Fail when a retraction IDENTIFIER survives anywhere in the tree. The
      spec's exit criterion 1 asks for a gate rather than a search, and it
      means it: a grep somebody ran once proves nothing about tomorrow.

      NOT a `grep -rin retract`. Every occurrence still here is a deliberate
      dated change-record saying what retraction used to do at that spot —
      which is why the next reader does not re-derive it from first
      principles. Measured 2026-09-01 over the files this gate scans: 268
      occurrences across 60 files in 14 directories. A naive grep reds on
      all 268 and goes green only by excluding those 60 files, at which
      point it enforces nothing. This one masks comments and string
      literals first and looks at code positions only, which is what a
      reintroduction actually looks like — there were 14 of those, all of
      them enforcement.

      Its half of the job is a reintroduced HELPER — a Go function, a
      TypeScript export, a proto field name, a tool script — across .go,
      .proto, .py and every JS/TS spelling (.ts/.tsx/.mts/.cts/.js/.jsx/
      .mjs/.cjs). contract/events.test.ts owns the other half and is the
      stronger check for the wire: it reads the GENERATED DESCRIPTORS, so a
      message deleted from the .proto but left in committed generated code
      is caught there and would look clean here. Neither substitutes for
      the other.
    cmds:
      - python3 tools/check_no_retraction_test.py -q
      - python3 tools/check-no-retraction.py .

  check:invariants:
    desc: >
      Every semgrep ADR guard in .semgrep/. Pointed at the DIRECTORY, not at
      individual rule files, so a new guard joins the gate by existing —
      writing a rule and forgetting to wire it is the failure this whole
      effort is about, and it nearly happened with the ADR-003 guard.
    cmds:
      # Targets must name every directory the rules apply to: semgrep's own
      # include/exclude only filters WITHIN the CLI target paths, it never
      # widens the scan. cmd/ was added alongside internal/ with ADR-008.
      #
      # A rule here must also NOT carry `paths.include` duplicating these
      # targets: doing so made the ADR-003 guard scan 0 files while exiting
      # 0 — clean-looking and enforcing nothing. Verify any new rule fires by
      # injecting a violation in a throwaway copy.
      - semgrep scan --config .semgrep/ --error --quiet internal/ cmd/

  check:vocabulary:
    desc: Deprecated alias for check:invariants; kept so older docs still work.
    cmds:
      - task: check:invariants

  check:arch:
    desc: Enforce package layering (store/engine/campaign)
    cmds:
      - go-arch-lint check

  check:drift:
    desc: Regenerate contract artifacts and fail if committed output drifted
    cmds:
      - task: generate:contract
      # cmd/vtt/tools.json is included alongside contract/gen (P7 task-3-
      # brief.md's binding decision): it's a committed copy generate:
      # contract's own `cp` line refreshes, so a hand-edit or staleness
      # there must fail this gate exactly like drift in contract/gen itself
      # — without this, the `cp` line would silently repair a divergence
      # instead of this check ever seeing it (git status scoped to
      # contract/gen alone never inspects cmd/vtt/tools.json).
      #
      # cmd/vtt/webdist joined on 2026-07-30 (client plan T5, approved as its
      # own decision per CLAUDE.md rule 2). It is a BUILD ARTIFACT rather than
      # generated code, which is only gateable because the build is
      # reproducible: client/vite.config.ts disables content hashes and
      # sourcemaps for that purpose, and it was verified by building twice
      # into separate directories and diffing (identical, no absolute paths,
      # no timestamps) BEFORE this line was written. If a vite upgrade ever
      # changes the output, this gate fails until webdist is rebuilt and
      # committed — that is the intended behaviour, and it makes a dependency
      # bump a two-step change on purpose.
      - task: build:client
      - |
        if [ -n "$(git status --porcelain -- contract/gen cmd/vtt/tools.json cmd/vtt/webdist)" ]; then
          git status --porcelain -- contract/gen cmd/vtt/tools.json cmd/vtt/webdist
          echo "check:drift: committed contract/gen, cmd/vtt/tools.json or cmd/vtt/webdist does not match regenerated output" >&2
          exit 1
        fi

  check:breaking:
    desc: Fail on breaking changes to contract/ vs main
    cmds:
      # silent: true suppresses only Task's own pre-run echo of this command's
      # source (which would otherwise print the literal string "pre-release"
      # from the else-branch below regardless of which branch actually runs,
      # defeating anything that greps this task's real output for that word).
      # The echo/buf-breaking output the script itself produces is untouched.
      - cmd: |
          # Resolve main as a LOCAL branch first, then origin/main.
          #
          # The fallback is not belt-and-braces, it is the only thing that makes
          # this gate run on a pull request at all. actions/checkout creates a
          # local branch only for the ref it checks out: on a push to main that
          # IS main, but on a PR it is the PR branch, and main exists solely as
          # refs/remotes/origin/main even with fetch-depth: 0. So this gate hard-
          # failed with "no local 'main' ref" on the repo's FIRST pull request,
          # having passed every previous run — every one of which was a push to
          # main, where the ref it wanted happened to exist.
          #
          # Read that the other way round: until that first PR, the contract
          # breaking-change gate had never once executed in the situation it was
          # built for. A breaking change would have been caught only after it
          # landed on main.
          REF=""
          if git rev-parse --verify -q main >/dev/null; then
            REF=main
          elif git rev-parse --verify -q origin/main >/dev/null; then
            REF=origin/main
          else
            echo "check:breaking: no 'main' or 'origin/main' ref — fetch main before running this gate" >&2
            exit 1
          fi
          if git ls-tree -d "$REF:contract" >/dev/null 2>&1; then
            cd contract
            if [ -f RELEASED ]; then
              go tool buf breaking --against "../.git#ref=$REF,subdir=contract"
            else
              echo "check:breaking: pre-release (contract/RELEASED absent) — REPORTING, not enforcing."
              echo "  ADR-007's additive-only rule binds from the first release others can run."
              echo "  Anything buf objects to below is real and will fail once that file exists."
              go tool buf breaking --against "../.git#ref=$REF,subdir=contract" || true
            fi
          else
            echo "check:breaking: contract/ not on $REF yet; gate activates after first merge"
          fi
        silent: true

  generate:contract:
    dir: contract
    cmds:
      - go tool buf lint
      - go tool buf generate
      - mkdir -p gen/tools
      - go run ../tools/toolgen -o gen/tools/tools.json
      # cmd/vtt/tools.json is a COMMITTED COPY (go:embed cannot cross
      # package directories, and cmd/vtt must stay a single binary with no
      # sidecar file — see cmd/vtt/mcp.go's doc comment). This line is what
      # binds that copy to check:drift: any hand-edit or staleness in
      # cmd/vtt/tools.json is overwritten here, so `task check:drift`'s
      # regenerate-and-diff catches divergence exactly like every other
      # generated artifact (P7 task-3-brief.md's binding decision).
      - cp gen/tools/tools.json ../cmd/vtt/tools.json

  generate:proto:
    dir: contract-spike/proto
    cmds:
      - buf lint
      - buf generate

  generate:jsonschema:
    dir: contract-spike/jsonschema
    cmds:
      - bunx quicktype --src-lang schema --lang go --package jsgen -o gen/go/types.go schemas/*.schema.json
      - bunx quicktype --src-lang schema --lang typescript --just-types -o gen/ts/types.ts schemas/*.schema.json

  generate:openapi:
    dir: contract-spike/openapi
    cmds:
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest -generate types,skip-prune -package oagen -o gen/go/types.gen.go openapi.yaml
      - bunx openapi-typescript openapi.yaml -o gen/ts/types.ts

  audit:mutation:
    desc: >
      Mutation testing audit (gremlins) over the five state-owning packages —
      minutes-long, deliberately NOT part of `check`. Requires gremlins
      (go install github.com/go-gremlins/gremlins/cmd/gremlins@latest).
      --workers 1 avoids CPU-contention false timeouts under gremlins'
      default parallel workers (see docs/superpowers/reports/
      2026-07-24-mutation-audit.md methodology note); --timeout-coefficient
      10 gives real per-mutant test runs comfortable headroom at workers=1.
      RESOLVED (internal/harness, 2026-07-29): the fixed-sleep cost that
      made this package impractical — ~70s of real wall-clock PER MUTANT,
      hours per run — is gone. Its tests run inside testing/synctest
      bubbles, so the suite is ~0.7s and a full mutation run measures
      3m38s. The remaining blocker is 29 unadjudicated survivors, which is
      a test-coverage gap rather than a runtime one.
    vars:
      # go env GOPATH, not a hardcoded $HOME/go: honors GOPATH overrides
      # (env var or `go env -w`) instead of assuming the Go default layout.
      GOPATH_DIR:
        sh: go env GOPATH
    cmds:
      - '{{.GREMLINS_BIN | default (print .GOPATH_DIR "/bin/gremlins")}} unleash ./internal/engine/ --workers 1 --timeout-coefficient 10'
      - '{{.GREMLINS_BIN | default (print .GOPATH_DIR "/bin/gremlins")}} unleash ./internal/store/ --workers 1 --timeout-coefficient 10'
      - '{{.GREMLINS_BIN | default (print .GOPATH_DIR "/bin/gremlins")}} unleash ./internal/campaign/ --workers 1 --timeout-coefficient 10'
      - '{{.GREMLINS_BIN | default (print .GOPATH_DIR "/bin/gremlins")}} unleash ./internal/identity/ --workers 1 --timeout-coefficient 10'
      - '{{.GREMLINS_BIN | default (print .GOPATH_DIR "/bin/gremlins")}} unleash ./internal/harness/ --workers 1 --timeout-coefficient 10'
