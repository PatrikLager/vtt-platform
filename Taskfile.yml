version: '3'

tasks:
  check:
    desc: Single quality gateway — every task must leave this green
    cmds:
      - go vet ./...
      - go test ./...
      - bun test
      - task: check:drift
      - task: check:breaking
      - task: check:vocabulary
      - task: check:arch

  check:vocabulary:
    desc: Fail on game-system vocabulary in platform code (P2/P4)
    cmds:
      # Targets must list every directory the rule's paths.include names
      # (.semgrep/vocabulary.yml) — semgrep's own include/exclude only
      # filters within whatever target paths are given on the CLI, it does
      # not widen scanning beyond them. cmd/ added alongside internal/ when
      # cmd/vtt was introduced (ADR-008).
      - semgrep scan --config .semgrep/vocabulary.yml --error --quiet internal/ cmd/

  check:arch:
    desc: Enforce package layering (store/engine/campaign)
    cmds:
      - go-arch-lint check

  check:drift:
    desc: Regenerate contract artifacts and fail if committed output drifted
    cmds:
      - task: generate:contract
      - |
        if [ -n "$(git status --porcelain -- contract/gen)" ]; then
          git status --porcelain -- contract/gen
          echo "check:drift: committed contract/gen does not match regenerated output" >&2
          exit 1
        fi

  check:breaking:
    desc: Fail on breaking changes to contract/ vs main
    cmds:
      - |
        if ! git rev-parse --verify -q main >/dev/null; then
          echo "check:breaking: no local 'main' ref — fetch main before running this gate" >&2
          exit 1
        fi
        if git ls-tree -d main:contract >/dev/null 2>&1; then
          cd contract && go tool buf breaking --against '../.git#branch=main,subdir=contract'
        else
          echo "check:breaking: contract/ not on main yet; gate activates after first merge"
        fi

  generate:contract:
    dir: contract
    cmds:
      - go tool buf lint
      - go tool buf generate
      - mkdir -p gen/tools
      - go run ../tools/toolgen -o gen/tools/tools.json

  generate:proto:
    dir: contract-spike/proto
    cmds:
      - buf lint
      - buf generate

  generate:jsonschema:
    dir: contract-spike/jsonschema
    cmds:
      - bunx quicktype --src-lang schema --lang go --package jsgen -o gen/go/types.go schemas/*.schema.json
      - bunx quicktype --src-lang schema --lang typescript --just-types -o gen/ts/types.ts schemas/*.schema.json

  generate:openapi:
    dir: contract-spike/openapi
    cmds:
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest -generate types,skip-prune -package oagen -o gen/go/types.gen.go openapi.yaml
      - bunx openapi-typescript openapi.yaml -o gen/ts/types.ts

  audit:mutation:
    desc: >
      Mutation testing audit (gremlins) over the four state-owning packages —
      minutes-long, deliberately NOT part of `check`. Requires gremlins
      (go install github.com/go-gremlins/gremlins/cmd/gremlins@latest).
      --workers 1 avoids CPU-contention false timeouts under gremlins'
      default parallel workers (see docs/superpowers/reports/
      2026-07-24-mutation-audit.md methodology note); --timeout-coefficient
      10 gives real per-mutant test runs comfortable headroom at workers=1.
    cmds:
      - '{{.GREMLINS_BIN | default (print (env "HOME") "/go/bin/gremlins")}} unleash ./internal/engine/ --workers 1 --timeout-coefficient 10'
      - '{{.GREMLINS_BIN | default (print (env "HOME") "/go/bin/gremlins")}} unleash ./internal/store/ --workers 1 --timeout-coefficient 10'
      - '{{.GREMLINS_BIN | default (print (env "HOME") "/go/bin/gremlins")}} unleash ./internal/campaign/ --workers 1 --timeout-coefficient 10'
      - '{{.GREMLINS_BIN | default (print (env "HOME") "/go/bin/gremlins")}} unleash ./internal/identity/ --workers 1 --timeout-coefficient 10'
