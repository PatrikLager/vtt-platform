# The single quality gateway, run on a machine that is not Patrik's laptop.
#
# One job, one command: `task check`. That is deliberate — CLAUDE.md says
# `task check` IS the gate, so CI must not grow its own parallel definition
# of "green" that can drift from the local one. Everything CI does beyond
# installing tools is reproducible with `task check` on any clone.
#
# The tiers (Taskfile.yml) run earlier and faster: pre-commit gets tier 1 in
# ~7s, pre-push gets tiers 2-3 in ~40s. CI is where coverage ratcheting and
# mutation testing live, because they are minutes-long and belong to the
# whole-product tier.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 30 until 2026-08-03, when this job was CANCELLED at 30m38s with
    # check:ts-mutation still running. Not a hang: the gate simply got bigger.
    # Measured on that run -- setup ~2m30s, gates through check:arch ~4m30s,
    # check:mutation (Go) 15m02s, check:ts-mutation 11m+ and unfinished, so
    # ~40m is the real cost. The old 27m45s green run had `mutate` scoped to
    # two files; it now covers the whole client at 1667 mutants.
    #
    # The two obvious ways to fit inside 30 are both barred, and deliberately:
    # narrowing `mutate` is "weakening a gate to pass it" (CLAUDE.md rule 2,
    # and check:ts-mutation's own desc says so outright), and splitting the
    # mutation gates into a parallel job would grow the second definition of
    # "green" this workflow's header exists to prevent. So the honest lever is
    # the ceiling. Set well above the projection rather than just over it --
    # mutation cost scales with the gated set, and a timeout that needs
    # revisiting every time a file is added is a flake waiting to happen.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # check:breaking diffs the contract against main; a shallow clone
          # has no main to diff against.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: arduino/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Versions pinned to what the gate was calibrated against locally.
      # golangci-lint especially: its config is schema-checked by
      # `golangci-lint config verify` inside `task lint`, and the v1/v2
      # schema split already cost this repo a silently-inert config.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@v1.14.0

      - name: Install semgrep
        run: pipx install semgrep

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest

      # buf, gremlins and protoc-gen-go are `go tool` dependencies in go.mod,
      # so they need no install step and cannot drift from the module.

      # `task check` runs `bun test`, which needs node_modules. Locally that
      # directory already existed and is gitignored, so the gate had a
      # dependency nobody had ever had to satisfy — a fresh clone would fail
      # exactly as this workflow's first run did. `task setup` is the same
      # step a human runs; CI calling it keeps the two honest.
      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Secret scan
        run: task check:secrets

      - name: task check
        run: task check
