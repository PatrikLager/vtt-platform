syntax = "proto3";

package vtt.v1;

import "vtt/v1/events.proto";

option go_package = "github.com/PatrikLager/vtt-platform/contract/gen/go/vtt/v1;vttv1";

message MoveTokenRequest {
  string token_id = 1;
  GridPosition to = 2;
  // Optional DM/agent annotation shown in the log. proto3 `optional` is the
  // contract's optionality annotation: toolgen omits such fields from `required`.
  optional string reason = 3;
}

message MoveTokenResponse {
  bool ok = 1;
  string error = 2;
  TokenMoved event = 3;
}

// Commands are imperative; the events they become are past-tense.
message CreateScene {
  string scene_id = 1;
  string name = 2;
  int32 grid_width = 3;
  int32 grid_height = 4;
}

message AddActor {
  Actor actor = 1;
}

message PlaceToken {
  string token_id = 1;
  string scene_id = 2;
  string actor_id = 3;
  GridPosition position = 4;
}

message StartSession {
  string name = 1;
}

message EndSession {}

message RetractEvents {
  int64 from_sequence = 1;
  int64 to_sequence = 2;
  string reason = 3;
}

message UseAbility {
  string actor_id = 1;
  string ability_id = 2;
  repeated string target_ids = 3;
}

message RemoveCondition {
  string actor_id = 1;
  string condition_id = 2;
}

message AddNarration {
  string text = 1;
  string as = 2;
  int64 anchor_from_seq = 3;
  int64 anchor_to_seq = 4;
}
message UpsertNote { string key = 1; string title = 2; string text = 3; }
message DeleteNote { string key = 1; }

message LoadAdventure { string adventure_id = 1; }

message ClientCommand {
  string request_id = 1;
  oneof command {
    MoveTokenRequest move_token = 10;
    CreateScene create_scene = 11;
    AddActor add_actor = 12;
    PlaceToken place_token = 13;
    StartSession start_session = 14;
    EndSession end_session = 15;
    RetractEvents retract_events = 16;
    UseAbility use_ability = 17;
    RemoveCondition remove_condition = 18;
    AddNarration add_narration = 19;
    UpsertNote upsert_note = 20;
    DeleteNote delete_note = 21;
    LoadAdventure load_adventure = 22;
  }
}

message CommandResult {
  string request_id = 1;
  bool ok = 2;
  string error = 3;
  int64 sequence = 4;
}

// The server->client frame; the oneof key is the frame discriminator.
// ServerFrame is everything the server sends on a connection.
//
// ORDERING CONTRACT — read this before writing a client.
//
// Frames are delivered in a single order per connection (one writer), and
// events are ordered among THEMSELVES by sequence. But a CommandResult is
// NOT ordered against the Envelopes that same command produced: the result
// is enqueued by the command loop and the events by the broadcast pump, two
// independent producers. Either can arrive first, and which one wins varies
// with load.
//
// So a client MUST NOT correlate by arrival position. Correlate a result by
// its request_id, and events by their sequence; a result's own sequence
// field names the first event that command produced, which is what ties the
// two streams together.
//
// This is not theoretical. The gateway's own tests read positionally, and it
// cost two separate CI failure modes — a batch of events outrunning a
// result, and one inversion desynchronising a connection permanently. See
// frameQueue in internal/gateway/server_test.go for the shape a correct
// reader takes: demultiplex the two kinds, never discard the one you were
// not currently asking for.
// CatchUpHead is sent ONCE, first, on every connection: the highest sequence
// the server has already queued as this connection's catch-up backlog.
//
// It exists because a client had no way to know when catch-up ENDED. The
// server streams backlog straight into live broadcast on one channel, so
// `vtt state dump` guessed — it stopped after 300ms of silence and called that
// "caught up". Mid-replay a 300ms gap is ordinary, and the dump then printed a
// SILENTLY INCOMPLETE state, which is the worst possible failure for a command
// whose output the golden corpus and the TypeScript fold-parity keystone are
// compared against. The same guess, in the soak harness, once reported the
// fold itself as divergent.
//
// The server always knew this number: Store.Subscribe preloads the whole
// backlog synchronously under its lock, so the head is exact at that instant.
// It simply was never told to anyone.
//
// A client that wants a point-in-time snapshot reads until it has seen
// head_sequence; a client that wants a live tail can ignore this frame. A
// head_sequence of 0 means the log was empty at subscribe time.
message CatchUpHead {
  int64 head_sequence = 1;
}

message ServerFrame {
  oneof frame {
    CommandResult result = 1;
    Envelope event = 2;
    CatchUpHead catch_up_head = 3;
  }
}
