syntax = "proto3";

package vtt.v1;

import "vtt/v1/events.proto";

option go_package = "github.com/PatrikLager/vtt-platform/contract/gen/go/vtt/v1;vttv1";

message MoveTokenRequest {
  string token_id = 1;
  GridPosition to = 2;
  // Optional DM/agent annotation shown in the log. proto3 `optional` is the
  // contract's optionality annotation: toolgen omits such fields from `required`.
  optional string reason = 3;
}

message MoveTokenResponse {
  bool ok = 1;
  string error = 2;
  TokenMoved event = 3;
}

// Commands are imperative; the events they become are past-tense.
message CreateScene {
  string scene_id = 1;
  string name = 2;
  int32 grid_width = 3;
  int32 grid_height = 4;
}

message AddActor {
  Actor actor = 1;
}

message PlaceToken {
  string token_id = 1;
  string scene_id = 2;
  string actor_id = 3;
  GridPosition position = 4;
}

message StartSession {
  string name = 1;
}

message EndSession {}

message RetractEvents {
  int64 from_sequence = 1;
  int64 to_sequence = 2;
  string reason = 3;
}

message UseAbility {
  string actor_id = 1;
  string ability_id = 2;
  repeated string target_ids = 3;
}

message RemoveCondition {
  string actor_id = 1;
  string condition_id = 2;
}

message AddNarration {
  string text = 1;
  string as = 2;
  int64 anchor_from_seq = 3;
  int64 anchor_to_seq = 4;
}
message UpsertNote { string key = 1; string title = 2; string text = 3; }
message DeleteNote { string key = 1; }

message LoadAdventure { string adventure_id = 1; }

message ClientCommand {
  string request_id = 1;
  oneof command {
    MoveTokenRequest move_token = 10;
    CreateScene create_scene = 11;
    AddActor add_actor = 12;
    PlaceToken place_token = 13;
    StartSession start_session = 14;
    EndSession end_session = 15;
    RetractEvents retract_events = 16;
    UseAbility use_ability = 17;
    RemoveCondition remove_condition = 18;
    AddNarration add_narration = 19;
    UpsertNote upsert_note = 20;
    DeleteNote delete_note = 21;
    LoadAdventure load_adventure = 22;
    GrantActorControl grant_actor_control = 23;
    RevokeActorControl revoke_actor_control = 24;
    PromoteParticipant promote_participant = 25;
  }
}

// GrantActorControl adds participant_id to actor_id's controller set.
// DM and agent only: a player may not hand their character to someone else,
// nor claim one.
message GrantActorControl {
  string actor_id = 1;
  string participant_id = 2;
}

// RevokeActorControl removes participant_id from actor_id's controller set.
// DM and agent may revoke anyone; a player may revoke ONLY THEMSELVES — that
// is releasing a character you hold, not taking one from someone else.
message RevokeActorControl {
  string actor_id = 1;
  string participant_id = 2;
  // Both fields genuinely required, same check as GrantActorControl above:
  // there is no meaning to revoking control of nothing, or from nobody.
}

// PromoteParticipant changes what a participant is ALLOWED to do.
//
// It is the only command that changes IDENTITY rather than campaign state, and
// so the only one that produces NO EVENT: a role lives in the participants
// table beside the token, one source of truth, never in the log (joining-a-
// table spec §3.1). The gateway's ToEvent allowlist names it for that reason.
//
// role may be ONLY "player" or "spectator" (spec §3.1a). A shared join link
// mints spectators, and letting promotion reach "dm" or "agent" would make
// that link a path to full authority in two steps — which is exactly what
// admitting-as-spectator exists to prevent. Minting a DM stays with
// `vtt invite`, deliberately out of band.
//
// DM and agent only. A spectator promoting itself would make the default
// meaningless.
message PromoteParticipant {
  string participant_id = 1;
  string role = 2;
}

message CommandResult {
  string request_id = 1;
  bool ok = 2;
  string error = 3;
  int64 sequence = 4;
}

// CatchUpHead is sent ONCE, first, on every connection: the highest sequence
// the server has already queued as this connection's catch-up backlog.
//
// It exists because a client had no way to know when catch-up ENDED. The
// server streams backlog straight into live broadcast on one channel, so
// `vtt state dump` guessed — it stopped after 300ms of silence and called that
// "caught up". Mid-replay a 300ms gap is ordinary, and the dump then printed a
// SILENTLY INCOMPLETE state, which is the worst possible failure for a command
// whose output the golden corpus and the TypeScript fold-parity keystone are
// compared against. The same guess, in the soak harness, once reported the
// fold itself as divergent.
//
// The server always knew this number: Store.Subscribe preloads the whole
// backlog synchronously under its lock, so the head is exact at that instant.
// It simply was never told to anyone.
//
// A client that wants a point-in-time snapshot reads until it has seen
// head_sequence; a client that wants a live tail can ignore this frame. A
// head_sequence of 0 means the log was empty at subscribe time.
message CatchUpHead {
  int64 head_sequence = 1;
}

// The server->client frame; the oneof key is the frame discriminator.
// ServerFrame is everything the server sends on a connection.
//
// ORDERING CONTRACT — read this before writing a client.
//
// Frames are delivered in a single order per connection (one writer), and
// events are ordered among THEMSELVES by sequence. But a CommandResult is
// NOT ordered against the Envelopes that same command produced: the result
// is enqueued by the command loop and the events by the broadcast pump, two
// independent producers. Either can arrive first, and which one wins varies
// with load.
//
// So a client MUST NOT correlate by arrival position. Correlate a result by
// its request_id, and events by their sequence; a result's own sequence
// field names the first event that command produced, which is what ties the
// two streams together.
//
// The ONE exception is catch_up_head, which is positional by definition: it
// is always the first frame on the connection. That is what makes it usable
// as a boundary at all — a client cannot decide when catch-up ended from a
// marker that might arrive mid-backlog.
//
// This is not theoretical. The gateway's own tests read positionally, and it
// cost two separate CI failure modes — a batch of events outrunning a
// result, and one inversion desynchronising a connection permanently. Adding
// catch_up_head then cost a third, in a test that provoked a close before
// reading the frame the connection opens with. See frameQueue in
// internal/gateway/server_test.go for the shape a correct reader takes:
// demultiplex the kinds, never discard the one you were not currently
// asking for.
message ServerFrame {
  oneof frame {
    CommandResult result = 1;
    Envelope event = 2;
    CatchUpHead catch_up_head = 3;
    PresenceSnapshot presence_snapshot = 4;
    PresenceChanged presence_changed = 5;
  }
}

// PresenceState is an ENUM rather than a bool, and that is deliberate.
//
// protojson omits zero values, so `bool connected = 3` would serialise a
// DISCONNECT as a frame with no connected field at all — making "this
// participant left" a fact carried by ABSENCE. That is the failure mode this
// repo keeps rediscovering (a denial "proved" by a dead connection, a batch
// read as complete because the stream went quiet, a mutant scored killed
// because a command exited non-zero). With an enum, both meaningful states are
// non-zero and always on the wire, and an absent field is UNSPECIFIED — an
// error a reader can detect, never a state it can misread.
enum PresenceState {
  PRESENCE_STATE_UNSPECIFIED = 0;
  PRESENCE_STATE_CONNECTED = 1;
  PRESENCE_STATE_DISCONNECTED = 2;
}

// PresenceChanged reports one participant joining or leaving.
//
// A FRAME, never an Envelope: who happened to be online is not campaign
// history. Appending it would make every replay reconstruct session noise and
// change what `vtt state dump` prints, for a fact that is true only while a
// socket is open. MapTool draws the same line -- PlayerDisconnectedMsg is a
// message, never campaign state.
//
// DISCONNECTED is emitted when a participant's LAST connection goes, not
// their first: invite tokens are reusable, so one participant may hold two
// (a second tab, a phone beside a laptop), and closing one must not tell the
// table they left.
message PresenceChanged {
  string participant_id = 1;
  string display_name = 2;
  PresenceState state = 3;
}

// PresenceSnapshot is the full present-set, sent once immediately after
// CatchUpHead. Sent unconditionally, including when empty, so a joining
// client never has to infer who is online from SILENCE -- the same reasoning
// as CatchUpHead itself, and the same failure this repo has hit repeatedly by
// reading absence as evidence.
message PresenceSnapshot {
  repeated PresenceChanged present = 1;
}
