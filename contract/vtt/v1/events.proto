syntax = "proto3";

package vtt.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/PatrikLager/vtt-platform/contract/gen/go/vtt/v1;vttv1";

message GridPosition {
  int32 x = 1;
  int32 y = 2;
}

message TokenMoved {
  string token_id = 1;
  string scene_id = 2;
  GridPosition from = 3;
  GridPosition to = 4;
}

message DieRoll {
  int32 die = 1;
  int32 result = 2;
}

message Modifier {
  string source = 1;
  int32 value = 2;
}

message AttackRolled {
  string attacker_id = 1;
  string target_id = 2;
  string expression = 3;
  repeated DieRoll rolls = 4;
  repeated Modifier modifiers = 5;
  int32 total = 6;
  string versus = 7;
  string outcome = 8;
}

message Resource {
  int32 current = 1;
  int32 max = 2;
}

// Engine-generic actor: named stats and pools are open maps; module_data is an
// opaque module-owned blob the contract never inspects (see README: Struct rules).
message Actor {
  string actor_id = 1;
  string name = 2;
  string module_id = 3;
  map<string, int32> attributes = 4;
  map<string, Resource> resources = 5;
  google.protobuf.Struct module_data = 6;
}

message Envelope {
  string event_id = 1;
  int64 sequence = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string session_id = 4;
  string actor_role = 5;
  oneof payload {
    TokenMoved token_moved = 10;
    AttackRolled attack_rolled = 11;
  }
}
