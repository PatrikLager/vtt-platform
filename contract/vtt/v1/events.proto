syntax = "proto3";

package vtt.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/PatrikLager/vtt-platform/contract/gen/go/vtt/v1;vttv1";

message GridPosition {
  int32 x = 1;
  int32 y = 2;
}

message TokenMoved {
  string token_id = 1;
  string scene_id = 2;
  GridPosition from = 3;
  GridPosition to = 4;
}

message DieRoll {
  int32 die = 1;
  int32 result = 2;
}

message Modifier {
  string source = 1;
  int32 value = 2;
}

message AttackRolled {
  string attacker_id = 1;
  string target_id = 2;
  string expression = 3;
  repeated DieRoll rolls = 4;
  repeated Modifier modifiers = 5;
  int32 total = 6;
  string versus = 7;
  string outcome = 8;
}

message Resource {
  int32 current = 1;
  int32 max = 2;
}

// ActorKind is WHAT an actor is, and it is the ONLY thing the "always known"
// visibility exception may key on (visibility spec §5.1).
//
// Control is transient; what a creature IS is not. Before this field the roster
// exception read "has any controller", which got both ordinary cases backwards:
// a player's character run by the DM while its player is offline was still a
// party member and would have been dropped from every roster, and a charmed
// monster handed to a player was still a monster and had its whole stat block
// published to the party.
//
// AN ENUM RATHER THAN A BOOL, and not for symmetry with JoinDoor/PresenceState.
// The third case is foreseeable — a neutral, a familiar, a summon — and a bool
// would have to be RENAMED to admit it, which ADR-007 forbids. Growing this
// enum is additive; every future value is "not a party member" to the rule
// below until something deliberately says otherwise, so growth fails closed.
//
// UNSPECIFIED IS A REAL STATE ON A RECORDED EVENT, not an error, and it means
// exactly one thing:
//
//	an absent kind is NOT a party member. Always.
//
// No inference from control, no second branch, no special case. A reader that
// asks "but does somebody hold it?" is implementing a rule this contract
// deleted on 2026-08-24. The fold stores what the log said, verbatim; readers
// apply the sentence above and nothing else.
//
// THE RULE IT REPLACED, recorded because deleting it is the load-bearing part
// of this design rather than a tidy-up. There was a migration rule — "absent +
// has a controller -> party member; absent + none -> not" — whose only job was
// to keep logs written before this field existed behaving as they had. It is
// gone because there are no such logs, and because that arm is precisely what
// could not tell "a log written before kind existed" from "a grant issued today
// that forgot": every leak this design chased lived in that gap. With one rule
// the ambiguity has nowhere to live.
//
// ABSENCE IS NOT TOLERATED ON ANY COMMAND, and there are two: AddActor.actor's
// kind and GrantActorControl.kind are each refused when absent, so a caller who
// says nothing is asked rather than guessed at. Every path that gives an actor
// a standing therefore states it — including the authored one, where an
// adventure's actors/*.json must declare "party_member" or "non_party" or fail
// to load (internal/adventure).
//
// THE HAZARD WAS NEVER TWO WRITERS. IT WAS A WRITER THAT COULD STAY SILENT.
// The leak this field exists to close came from inference from absence — an
// actor holding a controller with no kind had to be guessed at, and the guess
// was wrong. Two writers are safe once neither can be mute, which is why
// creation and the grant may both speak.
//
// The grant's refusal in particular is belt and braces — silence fails closed
// either way — and it stays because a command that quietly demotes the
// character it was handing over is a wrong answer given confidently.
enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;
  ACTOR_KIND_PARTY_MEMBER = 1;
  ACTOR_KIND_NON_PARTY = 2;
}

// Engine-generic actor: named stats and pools are open maps; module_data is an
// opaque module-owned blob the contract never inspects (see README: Struct rules).
message Actor {
  string actor_id = 1;
  string name = 2;
  string module_id = 3;
  map<string, int32> attributes = 4;
  map<string, Resource> resources = 5;
  google.protobuf.Struct module_data = 6;
  // Participant who may act as this actor; empty = DM/agent only.
  //
  // SUPERSEDED IN MEANING by controller_ids below, but NOT removed and never
  // will be: ActorAdded events carrying this field already exist in campaign
  // logs, and you cannot reinterpret history you have written.
  //
  // It is now a MIRROR: controller_ids[0] whenever the set is non-empty, and
  // empty ONLY when the set is empty. That rule is chosen so an old reader is
  // INCOMPLETE BUT NEVER WRONG — it sees one real controller and misses the
  // rest, which fails closed.
  //
  // The obvious alternative (empty whenever the set has more than one) is
  // wrong, and wrong in the way this contract elsewhere refuses. protojson
  // omits empty strings, so "no controller_id because two people share this
  // actor" and "no controller_id because nobody controls it" are BYTE
  // IDENTICAL on the wire — and empty already means DM/agent-only. A shared
  // actor would read as unowned: dropped from its own player's list in the
  // web client, and denied to BOTH controllers by any reader still checking
  // this field. That is a fact carried by ABSENCE, which is exactly what
  // PresenceState in commands.proto exists to avoid.
  string controller_id = 7;
  // Every participant who may act as this actor. Authoritative. Empty means
  // DM/agent only, exactly as an empty controller_id did.
  //
  // A set, because one character can be shared (a player running a companion
  // alongside their own, a second player covering while someone is away).
  // Ownership gates PLAYERS ONLY — DM and agent are outside it entirely
  // (internal/gateway/authz.go), so the DM acts on any actor without anyone
  // being granted or revoked anything.
  repeated string controller_ids = 8;
  // What this actor IS. The visibility roster, MayPerch and the spectator's
  // eyes all key on this and never on who holds it (visibility spec §5.1);
  // see ActorKind above for the rule and for what an absent value means.
  //
  // STATED AT CREATION, always: add_actor is refused without it, and so is an
  // adventure's actors/*.json. An ungranted actor declaring PARTY_MEMBER is a
  // pregenerated character waiting to be assigned, which the party is right to
  // know about — a grant later restates the standing if it changes.
  ActorKind kind = 9;
}

// ActorControlGranted adds a participant to an actor's controller set, and
// DECLARES WHAT THAT ACTOR IS while doing it.
// Idempotent: granting to a participant who already holds control is not an
// error and does not duplicate them — but it still records the kind, so a
// re-grant is how a charmed monster's standing is restated.
message ActorControlGranted {
  string actor_id = 1;
  string participant_id = 2;
  // What the actor IS, as of this grant (visibility spec §5.1, revised
  // 2026-08-23).
  //
  // KIND LIVES HERE RATHER THAN ONLY ON Actor because kind is not a fact
  // about a character — it is a fact about that character's STANDING RIGHT
  // NOW. A charmed monster becomes a player's to run and then becomes a
  // monster again. That is a TRANSITION, and a transition belongs on the
  // event that makes it, not on a property stamped once at creation.
  //
  // It also dissolves an ambiguity no rule could have resolved. Two grants
  // are byte-identical in every other respect: the DM assigning a pregen
  // character to a player, and an agent taking a goblin to run it. The
  // information that separates them was absent because nobody was asked.
  // Ask at the grant and each case states its own answer.
  //
  // PRECEDENCE over Actor.kind, which ActorAdded also carries: THE LATER
  // EVENT WINS, which is not a special rule but the fold's ordinary
  // semantics — events in order, each stating the newer fact. ActorAdded's
  // kind is what an actor is BORN as; a grant restates it. Any other
  // precedence would freeze standing at creation, which is exactly the
  // design this revision replaced.
  //
  // UNSPECIFIED here changes nothing: a grant that says nothing leaves the
  // actor's kind alone. Clearing it would be a SILENT DEMOTION, since an
  // absent kind is not a party member (see ActorKind) — the character would
  // drop off its own party's roster on the next corner. Revocation likewise
  // never clears kind: a player leaving the table does not turn their
  // character into a monster.
  //
  // A GRANT THAT SAYS NOTHING IS REFUSED, at the command boundary
  // (internal/gateway's validateGrantActorControl, called from handleCommand)
  // and never in the fold: proto3 has no `required`, and the two seams answer
  // different questions — the boundary decides what may be WRITTEN, the fold
  // keeps the log's own words. The refusal is belt and braces rather than the
  // only defence (silence fails closed either way), and it stays because a
  // command that quietly demotes the character it is handing over is a wrong
  // answer given confidently.
  ActorKind kind = 3;
}

// ActorControlRevoked removes a participant from an actor's controller set.
// Idempotent: revoking from a participant who does not hold control is a
// no-op. Revocation exists to REASSIGN a character — it is never needed for
// the DM to act, since DM authority is orthogonal to control, not a stronger
// form of it.
message ActorControlRevoked {
  string actor_id = 1;
  string participant_id = 2;
}

// TileRef is one square, resolved at LOAD from a tile name into the facts the
// engine needs plus the art name the renderer needs. Resolved rather than
// referenced so the log never depends on a pack file being present at replay
// (maps-as-geometry spec §5).
message TileRef {
  string kind = 1;      // "wall" | "floor" | "door" — spatial, closed set
  string material = 2;  // OPAQUE. The ruleset's business, never the platform's.
  string art = 3;       // pack tile name; empty means the standard picture
}

// SceneObject is SCENERY. Anything that acts, moves or holds state is an actor
// with a token (spec §3.4) — this line is what stops SceneObject becoming a
// second entity system.
//
// kind here is an OPEN descriptive label ("boulder", "chest") for the DM and
// the LLM to talk about. It is NOT the closed spatial set TileRef.kind uses,
// and no behaviour may be inferred from it: structural effect comes only from
// blocks_sight and blocks_move.
message SceneObject {
  string object_id = 1;
  string kind = 2;
  GridPosition at = 3;
  int32 width = 4;
  int32 height = 5;
  int32 rotation_degrees = 6;
  bool blocks_sight = 7;
  bool blocks_move = 8;
  string art = 9;
}

message SceneCreated {
  string scene_id = 1;
  string name = 2;
  int32 grid_width = 3;
  int32 grid_height = 4;
  // Keys are "x,y", column then row; the separator is a comma because a dot
  // reads as a decimal (maps-as-geometry spec §4.1).
  //
  // MAY BE EMPTY, and a reader must handle an absent key. A scene that
  // declares no terrain sends no tiles at all (Patrik's ruling 2026-08-13):
  // terrain is optional, exactly as it was for every scene authored before
  // maps-as-geometry, and requiring it would have broken the on-disk format
  // for everything written earlier. Do NOT assume len(tiles) ==
  // grid_width * grid_height.
  //
  // When tiles ARE sent they cover every square of the grid — completeness
  // is the point of the format, and the loader checks it before anything
  // that depends on it (internal/mapdef's CheckEverySquarePresent). So the
  // invariant holds where terrain is claimed, and only there.
  //
  // A square with no entry has no terrain: the zero TileRef's kind is "",
  // which matches neither "wall" nor "door", so it blocks nothing. That is
  // the same answer a reader gets for a scene that opted out entirely.
  //
  // SIZE, AND WHY IT IS TWO NUMBERS EVERYWHERE. One TileRef per tile. But
  // protojson appends a space after every comma in roughly half of all builds:
  // internal/detrand seeds that choice from a hash of the binary, on purpose,
  // so that "the output is unstable across different builds". Every byte
  // figure about this message therefore has two honest values about 2 bytes a
  // tile apart, and a reader who measures one and finds the doc quoting the
  // other will "correct" it into the same trap. Quote BOTH or neither — the
  // `visible` field below carries the full warning and the method for settling
  // it.
  //
  // Measured across differently-sized builds of this repo, on the real 32x32
  // ravine through mapdef.BuildSceneCreated and on synthetic grids:
  //
  //           per tile   32x32      60x60 (3600 tiles)   200x200
  //   compact  43.5 B    43.5 KiB   153.6 KiB            1.71 MiB
  //   spaced   45.5 B    45.5 KiB   160.6 KiB            1.79 MiB
  //
  // A fully tiled scene eventually exceeds the 200 KiB read limit Go clients
  // set (internal/harness/client.go) and the frame never arrives. WHERE
  // depends on art as much as on size: with no override the first grid over the
  // limit is 69x69 compact / 67x67 spaced — compared in BYTES against
  // readLimit's 204800, not against a rounded KiB figure, because 67x67 spaced
  // is 205224 B and reads as "200.4 KiB", which looks under a 200 KiB limit and
  // is not. Overriding every square with art puts even 60x60 over in BOTH
  // regimes: the cost is exactly len(name) + 9 bytes a tile compact and +10
  // spaced — the `,"art":""` scaffolding plus the name — so a 7-character name
  // takes a 3600-tile scene to 209.8 / 220.4 KiB and an 11-character one to
  // 223.9 / 234.4. SHIPPED TILE NAMES RUN 7 TO 11 CHARACTERS, and that range
  // needs its definition attached or it drifts: it means the names in a pack
  // that mapdef.LoadPack actually loads and Resolve consults. Exactly one
  // shipped map declares one — maps/cellar/map.json names cellar-basics, whose
  // four TILE names are earth-1, masonry-1, flagstone-1 and cellar-door.
  // client/public/std-pack is NOT in that set: it is a client-side rendering
  // manifest served as static files, never a mapdef.Pack. Nor are that pack's
  // OBJECT names, which travel in SceneObject.art rather than TileRef.art.
  // internal/mapdef.MaxWireTiles caps the tile COUNT at 3600, which refuses
  // 69x69 but admits that overridden 60x60, so the cap and the limit do not
  // line up. That mismatch is recorded, not fixed here. spec §7 files the
  // compact encoding that lifts the whole ceiling.
  map<string, TileRef> tiles = 5;
  repeated SceneObject objects = 6;
}

// TokenHidden says a token left YOUR view. PROJECTION-ONLY: no command
// produces it, so it can never reach the log — internal/gateway synthesizes
// it per recipient (visibility spec §4.2). It is a fact about a viewer's
// knowledge, not about the world, which is why the world's log does not
// carry it.
message TokenHidden {
  string token_id = 1;
}

// SceneSeen carries what a viewer can see of a scene RIGHT NOW — the whole
// current visible set, never a delta.
//
// Whole-set is deliberate: it is idempotent, so the projection needs no
// per-connection memory of what it already sent, and visibility spec §4.1's
// purity (a function of log-so-far and viewer, with nothing stored per
// connection) survives. The client UNIONS these into its explored set, which
// is what makes terrain remembered and creatures not.
//
// PROJECTION-ONLY, like TokenHidden.
message SceneSeen {
  string scene_id = 1;
  map<string, TileRef> tiles = 2;
  repeated SceneObject objects = 3;

  // visible is the squares this viewer can see right now, keyed "x,y" (column
  // then row, maps-as-geometry spec §4.1). The whole current set, never a
  // delta, exactly as tiles is.
  //
  // IT IS NOT THE KEYS OF tiles, and that is the entire reason it exists. A
  // token is a FREE OBJECT that needs no terrain to stand on (Patrik's ruling
  // 2026-08-22): sight is computed over the GRID, so on a scene that declares
  // no terrain every in-range square is visible and every token on it is
  // legitimately sent. tiles could not carry those squares — there is no
  // TileRef to put in them — so a client deriving visibility from tiles
  // overruled a decision the server had already made correctly, and hid a
  // player's own token on a bare canvas. Field 4 carries the decision itself
  // rather than a proxy for it.
  //
  // REPEATED STRING RATHER THAN map<string, bool>, for two reasons. A set has
  // no second axis, so a bool value is a slot with no meaning and one more
  // state ("present but false") for readers to disagree about. And it is
  // cheaper — but the size of the saving depends on which BUILD you measure,
  // and that is a fact about protojson rather than a sloppy measurement.
  //
  // PROTOJSON DELIBERATELY RANDOMISES ITS OUTPUT. encoding/json/encode.go's
  // prepareNext appends a space after every comma when detrand.Bool() is true,
  // and internal/detrand seeds that from an FNV hash of the binary itself:
  // "the output does not change within a program, while ensuring that the
  // output is unstable across different builds". So one binary emits
  // {"visible":["0,0","1,0"]} and the next emits {"visible":["0,0", "1,0"]},
  // and every per-square figure below has two honest values exactly 1.00 B
  // apart. Measured across fourteen binaries of this repo, varying only their
  // size: seven of each regime.
  //
  //   compact  7.67 B/square (27.0 KiB per 3600) vs 12.67 — 39.5% cheaper
  //   spaced   8.67 B/square (30.5 KiB per 3600) vs 13.67 — 36.6% cheaper
  //
  // Quote BOTH or neither. The repo's own long-standing figure is in the
  // spaced regime — mapdef.MaxWireTiles records "a 32x32 scene at 45.5 KiB,
  // about 45.5 bytes a tile", and BuildSceneCreated on the real ravine returns
  // exactly that in a spaced build and 43.5 KiB / 43.5 B a tile in a compact
  // one.
  //
  // Go and TS both hold this concept as map[string]bool /
  // Record<string, boolean>, so both folds turn the list into a set on arrival.
  repeated string visible = 4;
}

// A door is one nature, not two (spec §3.3): TileRef.kind is "door", and
// whether it is open is folded state here, never part of the tile name —
// encoding openness in the vocabulary would put a mutable fact in an
// immutable declaration, and terrain is immutable.
message DoorOpened { string scene_id = 1; GridPosition at = 2; }

// DoorOpened's counterpart; see DoorOpened's comment above — the same
// folded-state reasoning applies to both directions.
message DoorClosed { string scene_id = 1; GridPosition at = 2; }

message ActorAdded {
  Actor actor = 1;
}

message TokenPlaced {
  string token_id = 1;
  string scene_id = 2;
  string actor_id = 3;
  GridPosition position = 4;
}

// TokenRemoved takes a token off the board, for good, going forward
// (retraction-leaves spec §5.1). Produced by RemoveToken (commands.proto).
//
// NOT TokenHidden. TokenHidden, below, is PROJECTION-ONLY — no command
// produces it, so it can never reach the log — and it means "you cannot see
// it", a fact about one viewer's knowledge of the world. TokenRemoved is a
// REAL event that reaches every fold, and it means the piece is not part of
// the world anymore: engine.Apply and client/src/fold.ts both delete it from
// state, and it stays gone for every future reader. It does not erase that
// the token ever existed — the log still carries whatever TokenPlaced/
// TokenMoved/etc. it had before this event, unaltered; the log only goes
// forward (2026-08-31), so removal is the platform's answer to "get rid of a
// token" now that retraction is gone.
message TokenRemoved {
  string token_id = 1;
}

message SessionStarted {
  string name = 1;
}

message SessionEnded {}

message AbilityUsed {
  string actor_id = 1;
  string ability_id = 2;
  repeated string target_ids = 3;
  message Roll {
    string expression = 1;
    repeated int32 results = 2;
    int32 total = 3;
  }
  repeated Roll rolls = 4;
  string outcome_summary = 5;
}
message ResourceChanged {
  string actor_id = 1;
  string resource = 2;
  int32 delta = 3;
  int32 new_value = 4;
  string reason = 5;
}
message ConditionApplied {
  string actor_id = 1;
  string condition_id = 2;
  string source = 3;
}
message ConditionRemoved {
  string actor_id = 1;
  string condition_id = 2;
  string reason = 3;
}

message NarrationAdded {
  string text = 1;
  string as = 2;
  int64 anchor_from_seq = 3;
  int64 anchor_to_seq = 4;
}
message NoteUpserted { string key = 1; string title = 2; string text = 3; }
message NoteDeleted { string key = 1; }

// Pure testimony (AbilityUsed's pattern — engine no-op): the compile
// batch's FIRST event, making the log self-describing about what was
// loaded. Every other event the batch produces is existing vocabulary
// (SceneCreated, ActorAdded, TokenPlaced, NoteUpserted, NarrationAdded).
message AdventureLoaded {
  string adventure_id = 1;
  string name = 2;
}

message Envelope {
  string event_id = 1;
  int64 sequence = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string session_id = 4;
  string actor_role = 5;
  // Who caused this event; stamped by the gateway.
  string participant_id = 6;
  oneof payload {
    TokenMoved token_moved = 10;
    AttackRolled attack_rolled = 11;
    SceneCreated scene_created = 12;
    ActorAdded actor_added = 13;
    TokenPlaced token_placed = 14;
    SessionStarted session_started = 15;
    SessionEnded session_ended = 16;
    AbilityUsed ability_used = 18;
    ResourceChanged resource_changed = 19;
    ConditionApplied condition_applied = 20;
    ConditionRemoved condition_removed = 21;
    NarrationAdded narration_added = 22;
    NoteUpserted note_upserted = 23;
    NoteDeleted note_deleted = 24;
    AdventureLoaded adventure_loaded = 25;
    ActorControlGranted actor_control_granted = 26;
    ActorControlRevoked actor_control_revoked = 27;
    DoorOpened door_opened = 28;
    DoorClosed door_closed = 29;
    // Field numbers 30/31, not the brief's 28/29 — 27 was not the highest
    // in use: DoorOpened/DoorClosed already hold 28/29 (maps-as-geometry
    // Task 1 fix, landed after the plan's signatures were captured). Reusing
    // 28/29 here would silently collide two payload types onto the same
    // wire tag, which ADR-007/check:breaking exists to catch — corrected to
    // the actual next-free numbers instead (visibility Task 2 report).
    TokenHidden token_hidden = 30;
    SceneSeen scene_seen = 31;
    // 32 is the next-free slot after scene_seen = 31 (retraction-leaves
    // Task 8 report).
    TokenRemoved token_removed = 32;
  }
}
