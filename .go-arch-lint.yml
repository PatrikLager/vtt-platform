version: 3
workdir: .
allow:
  depOnAnyVendor: true
# Prefix-match semantics: go-arch-lint matches exclude entries as path
# prefixes, not exact directory names. A future sibling directory whose name
# starts with "contract-spike" (e.g. "contract-spike-v2") would silently
# match this entry too and go unchecked.
exclude:
  - contract-spike
excludeFiles:
  - contract/roundtrip_test\.go$
components:
  contract: { in: contract/gen/go/** }
  store:    { in: internal/store }
  engine:   { in: internal/engine }
  campaign: { in: internal/campaign }
  toolgen:  { in: tools/toolgen }
deps:
  store:    { mayDependOn: [contract, store] }
  engine:   { mayDependOn: [contract, engine] }
  campaign: { mayDependOn: [contract, store, engine, campaign] }
  toolgen:  { mayDependOn: [contract] }
