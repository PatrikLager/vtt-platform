version: 3
workdir: .
allow:
  depOnAnyVendor: true
# Prefix-match semantics: go-arch-lint matches exclude entries as path
# prefixes, not exact directory names. A future sibling directory whose name
# starts with "contract-spike" (e.g. "contract-spike-v2") would silently
# match this entry too and go unchecked.
exclude:
  - contract-spike
  # Stryker's sandbox is a full COPY of the repo, Go files included. A run
  # that crashes (or one configured with cleanTempDir: false while debugging)
  # leaves it on disk, and go-arch-lint then reports every duplicated file as
  # unattached — 147 notices, and a pre-commit hook rejecting a commit for a
  # reason nowhere near the change. stryker.conf.json also excludes the Go
  # tree from the sandbox; this is the backstop for when that is not enough.
  - .stryker-tmp
excludeFiles:
  - contract/roundtrip_test\.go$
  # Same reason as roundtrip_test.go above: package contract_test lives
  # directly in contract/, which the "contract" component's `in:` pattern
  # (contract/gen/go/**) does not cover, so any *_test.go sitting beside it
  # is unattached the same way.
  - contract/contract_test\.go$
  # identity is self-only in production code (mayDependOn: [identity]), but
  # its test file legitimately proves coexistence with store.Store on the
  # same campaign file (task-3-brief.md Step 1) — that one behavioral case
  # requires importing store + contract, same precedent as the entry above.
  - internal/identity/identity_test\.go$
  # Same precedent, and the same shape of exception: identity is self-only in
  # PRODUCTION (mayDependOn: [identity]) and must stay that way, but this test
  # file drives Open and JoinAdmits through internal/testdb's fault-injecting
  # driver to reach the arms that decide what happens when SQLite fails
  # mid-operation. Excluding the FILE rather than adding testdb to identity's
  # mayDependOn is the whole point: the latter would let production identity
  # import a test-only driver, which is exactly the dependency this rule
  # exists to forbid.
  - internal/identity/fault_internal_test\.go$
components:
  contract: { in: contract/gen/go/** }
  store:    { in: internal/store }
  engine:   { in: internal/engine }
  campaign: { in: internal/campaign }
  toolgen:  { in: tools/toolgen }
  identity: { in: internal/identity }
  gateway:  { in: internal/gateway }
  harness:  { in: internal/harness }
  mcp:      { in: internal/mcp }
  rules:    { in: internal/rules }
  # internal/rules/conformance is its own component: go-arch-lint's `in:`
  # match is non-recursive (a subdirectory isn't automatically covered by
  # its parent's entry), and this subpackage's dependency shape genuinely
  # differs from rules' own (it imports rules itself, which rules cannot).
  conformance: { in: internal/rules/conformance }
  # internal/adventure (Task 2, adventure-format spec §5): Load/Compile for
  # the adventure format v1 — a directory of prepared content (scenes,
  # statblock instances, notes, an opening) written FOR a specific ruleset,
  # compiled into ordinary setup events one AppendBatch applies.
  adventure: { in: internal/adventure }
  # internal/adventure/conformance (Task 3, adventure-format spec §6): the
  # adventure-format analog of internal/rules/conformance — same reasoning
  # as that package's own entry above (go-arch-lint's `in:` match is
  # non-recursive, and this subpackage's dependency shape genuinely differs
  # from adventure's own: it imports adventure AND rules, neither of which
  # adventure itself may import back).
  adventureconformance: { in: internal/adventure/conformance }
  # internal/testdb (2026-08-11): a SQLite driver that fails one statement on
  # demand, so the error arms every store in this repo carries are reachable
  # at all. TEST-ONLY — nothing in cmd/ or the server imports it — but it is a
  # real package rather than a _test.go file because more than one component
  # needs it, and Go cannot import test files.
  testdb:   { in: internal/testdb }
  cmd:      { in: cmd/** }
deps:
  store:    { mayDependOn: [contract, store] }
  engine:   { mayDependOn: [contract, engine] }
  campaign: { mayDependOn: [contract, store, engine, campaign] }
  toolgen:  { mayDependOn: [contract] }
  identity: { mayDependOn: [identity] }
  # Self-only, and self is needed: testdb's own tests are an EXTERNAL package
  # (testdb_test) so they can drive the driver the way a caller does, which
  # means importing it. Nothing else here may depend on testdb — the one
  # component that does is excluded by file, above.
  testdb:   { mayDependOn: [testdb] }
  # rules added Task 6 (ruleset-interpreter wiring): the gateway's
  # use_ability handler calls rules.Resolve directly over an OPTIONAL
  # server-config *rules.Ruleset (nil keeps every pre-Task-6 behavior
  # unchanged — see gateway.Server.WithRuleset's doc comment).
  # adventure added Task 4-forward (adventure-format spec §5/§7): the
  # gateway's future load_adventure handler will call adventure.Load (at
  # boot, per-adventure) and adventure.Compile (per request) directly, the
  # same shape rules gained in Task 6 above. Declared now, alongside Task
  # 2's own adventure component, rather than left for Task 4 to add — Task
  # 2's brief pre-authorizes this edge so arch-lint never blocks Task 4's
  # gateway wiring on a forgotten dependency-graph update.
  gateway:  { mayDependOn: [contract, campaign, engine, identity, gateway, rules, adventure] }
  # The P1 rule: the harness proves a client can drive a live table using
  # only the wire constitution — store/campaign/gateway/identity are
  # forbidden dependencies, enforced here (task-1-brief.md's binding rule).
  harness:  { mayDependOn: [contract, engine, harness] }
  # P1 extended to the MCP gateway (docs/superpowers/plans/2026-07-24-mcp-
  # gateway.md Global Constraints): the MCP server is also a wire client —
  # store/campaign/gateway/identity forbidden here too, tests included. The
  # official Go MCP SDK is vendor (depOnAnyVendor: true above), unlisted.
  mcp:      { mayDependOn: [harness, engine, contract, mcp] }
  # internal/rules is the ruleset format/loader/expression-grammar package
  # (ruleset-interpreter spec §5, task-4-brief.md): reads no other package's
  # code yet — the engine/contract entries are pre-registered for Task 5's
  # Resolve (pure function over engine.State + contract types); nothing else
  # may import rules until Task 6 wires it into the gateway.
  # deepScan: false — rules.Roller is a DELIBERATE extension-point
  # interface (expr.go's doc comment: "production code gets a crypto-
  # seeded implementation; tests use fixed/deterministic ones"): Eval and
  # Resolve accept it and call .Roll() on it specifically so that ANY
  # caller (conformance's fixture/table rollers today; a future gateway-
  # side crypto-seeded implementation once Task 6 wires Resolve in) can
  # supply a concrete implementation without rules importing them back.
  # go-arch-lint's deep-scan heuristic treats "component X calls a method
  # on an interface value whose concrete type is defined in component Y"
  # as an implicit X-depends-on-Y edge — correct for accidental leakage,
  # but a false positive for intentional dependency inversion via a
  # narrow, purpose-built interface. The plain import graph (mayDependOn
  # above) is untouched and still forbids rules from importing conformance
  # or anything else — this override only silences the reverse-inference
  # heuristic for rules' own files.
  rules:    { mayDependOn: [engine, contract, rules], deepScan: false }
  # internal/rules/conformance (Task 5, ruleset-interpreter spec §8) is the
  # P4 proof harness: it drives rules.Load and rules.Resolve against any
  # ruleset directory and needs engine.State to build the fixture actors
  # Resolve reads — the same shape as rules' own pre-registered deps, plus
  # rules itself (which rules cannot depend on).
  conformance: { mayDependOn: [rules, engine, contract, conformance] }
  # internal/adventure (Task 2, adventure-format spec §5): Load validates a
  # statblock's attribute/resource vocabulary against a *rules.Ruleset
  # (rules dep); Compile builds *vttv1.Envelope values (contract dep) and
  # checks collisions against an *engine.State snapshot (engine dep).
  # gateway imports it for the load_adventure handler (Task 4); cmd now
  # imports it too (Task 4, see cmd's own entry below) — `vtt serve
  # --adventures-dir`/`vtt mcp --adventures-dir` both walk the adventures
  # directory and call adventure.Load per subdirectory at boot, the same
  # as-needed discipline rules' own cmd edge followed (added at Task 6, not
  # pre-declared earlier).
  adventure: { mayDependOn: [engine, contract, rules, adventure] }
  # internal/adventure/conformance (Task 3, adventure-format spec §6): mirrors
  # rules/conformance's own registration exactly — Run resolves+loads a
  # ruleset (rules dep), loads+compiles an adventure against it (adventure
  # dep), compiles against an engine.State (engine dep), and builds
  # *vttv1.Envelope-shaped goldens (contract dep).
  adventureconformance: { mayDependOn: [adventure, rules, engine, contract, adventureconformance] }
  # rules added Task 6: `vtt serve --ruleset` and `vtt mcp --ruleset` both
  # call rules.Load directly (cmd composes; internal/mcp itself still may
  # NOT import rules — its Config carries only the already-loaded guide
  # string, so the P1 wire-client boundary above is untouched).
  # adventure added Task 4 (adventure-format spec §7 wiring): `vtt serve
  # --adventures-dir` and `vtt mcp --adventures-dir` both walk the
  # adventures directory and call adventure.Load per subdirectory directly
  # (cmd composes, same shape as rules above); internal/mcp itself still may
  # NOT import adventure — its Config carries only the already-loaded guide
  # strings (map[adventure_id]guide.md content), so the P1 wire-client
  # boundary is untouched here too.
  cmd:      { mayDependOn: [gateway, identity, campaign, contract, cmd, harness, mcp, rules, adventure] }
